<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Brand Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Glow Filters -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Dot Pattern for Canvas -->
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6" />
    </pattern>

    <!-- Gradients for Nodes -->
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="loopbackGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Marker Arrow -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#fb923c" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />

  <!-- Subtle Canvas Grid -->
  <rect width="1280" height="640" fill="url(#dotGrid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.15" filter="url(#cyanGlow)" />
  <circle cx="1060" cy="380" r="180" fill="#6366f1" opacity="0.12" filter="url(#cyanGlow)" />

  <!-- ================= LEFT COLUMN: HERO BRANDING ================= -->
  <g transform="translate(70, 75)">
    <!-- Water / Flow Logo Icon -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="58" height="58" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <path d="M 29 14 C 29 14, 43 30, 43 38 C 43 45.7, 36.7 52, 29 52 C 21.3 52, 15 45.7, 15 38 C 15 30, 29 14, 29 14 Z" fill="url(#titleGrad)" />
      <circle cx="25" cy="36" r="3.5" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- Version Badge -->
    <rect x="74" y="14" width="94" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="121" y="32" fill="#38bdf8" font-size="12" font-weight="700" class="font-mono" text-anchor="middle">v0.1.0-beta</text>

    <!-- Title -->
    <text x="0" y="125" fill="url(#titleGrad)" font-size="58" font-weight="900" class="font-sans" letter-spacing="-1">Wode</text>
    
    <!-- Tagline -->
    <text x="0" y="165" fill="#f8fafc" font-size="20" font-weight="700" class="font-sans">
      Local-First Swimlane Workflow Builder
    </text>
    <text x="0" y="195" fill="#94a3b8" font-size="16" font-weight="400" class="font-sans">
      + AI Agent MCP Live Sync (<tspan fill="#38bdf8" class="font-mono">ws://localhost:3333</tspan>)
    </text>

    <!-- Description -->
    <text x="0" y="240" fill="#64748b" font-size="14" font-weight="400" class="font-sans">
      Deterministic layout algorithms • Zero telemetry • Human + AI Co-authoring
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 280)">
      <!-- Badge 1: Local-first -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="16" cy="18" r="4" fill="#10b981" />
        <text x="28" y="23" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">100% Client-Side Offline</text>
      </g>
      <!-- Badge 2: Auto-column layout -->
      <g transform="translate(192, 0)">
        <rect width="185" height="36" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="16" cy="18" r="4" fill="#38bdf8" />
        <text x="28" y="23" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Deterministic Auto-Column</text>
      </g>
      <!-- Badge 3: MCP Server -->
      <g transform="translate(0, 48)">
        <rect width="180" height="36" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="16" cy="18" r="4" fill="#818cf8" />
        <text x="28" y="23" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Model Context Protocol</text>
      </g>
      <!-- Badge 4: Standalone HTML -->
      <g transform="translate(192, 48)">
        <rect width="185" height="36" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.6" />
        <circle cx="16" cy="18" r="4" fill="#f59e0b" />
        <text x="28" y="23" fill="#e2e8f0" font-size="12" font-weight="600" class="font-sans">Standalone HTML Export</text>
      </g>
    </g>

    <!-- Supported Agents Row -->
    <g transform="translate(0, 410)">
      <text x="0" y="0" fill="#64748b" font-size="12" font-weight="600" class="font-mono" letter-spacing="1">COMPATIBLE WITH ALL MCP AGENTS</text>
      <g transform="translate(0, 15)">
        <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" />
        <text x="42" y="17" fill="#cbd5e1" font-size="11" font-weight="500" class="font-sans" text-anchor="middle">Claude</text>

        <rect x="95" y="0" width="85" height="26" rx="6" fill="#1e293b" />
        <text x="137" y="17" fill="#cbd5e1" font-size="11" font-weight="500" class="font-sans" text-anchor="middle">Cursor</text>

        <rect x="190" y="0" width="95" height="26" rx="6" fill="#1e293b" />
        <text x="237" y="17" fill="#cbd5e1" font-size="11" font-weight="500" class="font-sans" text-anchor="middle">Antigravity</text>

        <rect x="295" y="0" width="85" height="26" rx="6" fill="#1e293b" />
        <text x="337" y="17" fill="#cbd5e1" font-size="11" font-weight="500" class="font-sans" text-anchor="middle">Windsurf</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: INTERACTIVE CANVAS ILLUSTRATION ================= -->
  <g transform="translate(520, 60)" filter="url(#cardGlow)">
    <!-- Canvas Frame Container -->
    <rect width="690" height="520" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />

    <!-- Canvas Header Bar -->
    <path d="M 0 16 C 0 7.2 7.2 0 16 0 L 674 0 C 682.8 0 690 7.2 690 16 L 690 44 L 0 44 Z" fill="#0f172a" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.8" />

    <rect x="80" y="11" width="160" height="22" rx="4" fill="#1e293b" />
    <text x="160" y="26" fill="#94a3b8" font-size="11" font-weight="500" class="font-sans" text-anchor="middle">🤖 Agent (MCP) Active</text>

    <rect x="560" y="11" width="110" height="22" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.8" />
    <text x="615" y="26" fill="#38bdf8" font-size="11" font-weight="600" class="font-sans" text-anchor="middle">Live Sync • 3333</text>

    <!-- Diagram Header #1 -->
    <g transform="translate(20, 60)">
      <rect width="650" height="34" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.2" />
      <rect x="8" y="7" width="28" height="20" rx="4" fill="#2563eb" />
      <text x="22" y="22" fill="#ffffff" font-size="11" font-weight="700" class="font-mono" text-anchor="middle">#1</text>
      <text x="46" y="22" fill="#60a5fa" font-size="13" font-weight="700" class="font-sans">Feature Delivery Workflow</text>
      <text x="235" y="22" fill="#64748b" font-size="11" class="font-sans">• 3 swimlanes (Deterministic auto-column alignment)</text>
    </g>

    <!-- SWIMLANES & NODES AREA -->
    <!-- Lane 1: User / Product Owner -->
    <g transform="translate(20, 108)">
      <rect width="130" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect width="130" height="24" rx="6" fill="#1e293b" />
      <text x="12" y="16" fill="#38bdf8" font-size="11" font-weight="700" class="font-sans">👤 User Request</text>
      
      <!-- Lane Canvas Track -->
      <rect x="140" y="0" width="510" height="110" rx="6" fill="#070d19" stroke="#1e293b" stroke-width="1" />

      <!-- Node 1: Submit Requirement -->
      <g transform="translate(160, 25)">
        <rect width="150" height="60" rx="8" fill="url(#nodeBlue)" stroke="#38bdf8" stroke-width="1.5" />
        <text x="14" y="26" fill="#94a3b8" font-size="10" font-weight="700" class="font-mono">#01 TRIGGER</text>
        <text x="14" y="45" fill="#f8fafc" font-size="12" font-weight="600" class="font-sans">Submit Requirement</text>
      </g>
    </g>

    <!-- Lane 2: AI Agent (MCP) -->
    <g transform="translate(20, 230)">
      <rect width="130" height="120" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <rect width="130" height="24" rx="6" fill="#312e81" />
      <text x="12" y="16" fill="#a5b4fc" font-size="11" font-weight="700" class="font-sans">🤖 AI Agent (MCP)</text>

      <!-- Lane Canvas Track -->
      <rect x="140" y="0" width="510" height="120" rx="6" fill="#070d19" stroke="#1e293b" stroke-width="1" />

      <!-- Node 2: Analyze & Auto-align (Directly below Node 1! Straight vertical line) -->
      <g transform="translate(160, 30)">
        <rect width="150" height="60" rx="8" fill="url(#nodeBlue)" stroke="#818cf8" stroke-width="1.8" />
        <text x="14" y="26" fill="#a5b4fc" font-size="10" font-weight="700" class="font-mono">#02 CO-AUTHOR</text>
        <text x="14" y="45" fill="#f8fafc" font-size="12" font-weight="600" class="font-sans">Auto-Column Layout</text>
      </g>

      <!-- Node 3: WebSocket Live Push -->
      <g transform="translate(350, 30)">
        <rect width="150" height="60" rx="8" fill="url(#nodeBlue)" stroke="#818cf8" stroke-width="1.5" />
        <text x="14" y="26" fill="#a5b4fc" font-size="10" font-weight="700" class="font-mono">#03 LIVE SYNC</text>
        <text x="14" y="45" fill="#f8fafc" font-size="12" font-weight="600" class="font-sans">WebSocket Push :3333</text>
      </g>
    </g>

    <!-- Lane 3: Review & Deliver -->
    <g transform="translate(20, 362)">
      <rect width="130" height="110" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <rect width="130" height="24" rx="6" fill="#064e3b" />
      <text x="12" y="16" fill="#6ee7b7" font-size="11" font-weight="700" class="font-sans">✅ Output &amp; Verify</text>

      <!-- Lane Canvas Track -->
      <rect x="140" y="0" width="510" height="110" rx="6" fill="#070d19" stroke="#1e293b" stroke-width="1" />

      <!-- Node 4: Interactive HTML Export -->
      <g transform="translate(350, 25)">
        <rect width="150" height="60" rx="8" fill="url(#nodeBlue)" stroke="#10b981" stroke-width="1.5" />
        <text x="14" y="26" fill="#6ee7b7" font-size="10" font-weight="700" class="font-mono">#04 RESULT</text>
        <text x="14" y="45" fill="#f8fafc" font-size="12" font-weight="600" class="font-sans">Export HTML / JSON</text>
      </g>
    </g>

    <!-- CONNECTING EDGES (The highlight of Wode's deterministic routing!) -->
    <!-- Edge 1: Node 1 -> Node 2 (Straight Vertical Downward Arrow!) -->
    <path d="M 235 193 L 235 260" stroke="url(#edgeGrad)" stroke-width="2.5" marker-end="url(#arrowCyan)" fill="none" />
    <rect x="245" y="215" width="80" height="20" rx="4" fill="#0b1120" stroke="#38bdf8" stroke-width="0.8" />
    <text x="285" y="229" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono" text-anchor="middle">vertical flow</text>

    <!-- Edge 2: Node 2 -> Node 3 (Horizontal Step) -->
    <path d="M 310 290 L 350 290" stroke="url(#edgeGrad)" stroke-width="2.5" marker-end="url(#arrowCyan)" fill="none" />

    <!-- Edge 3: Node 3 -> Node 4 (Straight Vertical Downward Arrow!) -->
    <path d="M 425 320 L 425 387" stroke="url(#edgeGrad)" stroke-width="2.5" marker-end="url(#arrowCyan)" fill="none" />

    <!-- Edge 4: Loopback/Feedback Arched Curve (Node 3 -> Node 1 Arched Above) -->
    <path d="M 425 260 C 425 155, 235 155, 235 193" stroke="url(#loopbackGrad)" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowOrange)" fill="none" />
    <rect x="290" y="142" width="94" height="20" rx="4" fill="#0b1120" stroke="#fb923c" stroke-width="0.8" />
    <text x="337" y="156" fill="#fb923c" font-size="10" font-weight="600" class="font-mono" text-anchor="middle">retry loopback</text>

    <!-- Canvas Bottom Bar / Status -->
    <g transform="translate(20, 485)">
      <circle cx="6" cy="6" r="4" fill="#10b981" />
      <text x="18" y="10" fill="#94a3b8" font-size="11" class="font-sans">Canvas State: Synced • 0 collisions • 100% deterministic layout</text>
    </g>
  </g>
</svg>
